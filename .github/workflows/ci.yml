name: Tests

# Every push and pull request runs the whole suite (syntax checks + unit and jsdom
# tests). GitHub Pages is not deployed from here: it publishes docs/ (the privacy
# policy Google Play links to) through the repository's branch-based Pages setting.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
