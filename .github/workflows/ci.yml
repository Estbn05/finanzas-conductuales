name: Tests

# Every push and pull request runs the whole suite (syntax checks + unit and jsdom
# tests). GitHub Pages is not deployed from here: it publishes docs/ (the privacy
# policy Google Play links to) through the repository's branch-based Pages setting.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee test-output.log

      # Failing tests and their errors as annotations, which show on the run's page
      # (and through the public API) without opening the full log.
      - name: Report failing tests
        if: failure()
        run: |
          grep -E "^\s*not ok" test-output.log | head -10 | while read -r line; do echo "::error title=Test failed::$line"; done
          grep -E "^\s+error: |^\s+(expected|actual):|location:" test-output.log | head -30 | paste -sd ' ' | cut -c1-1500 | while read -r line; do echo "::error title=Errors::$line"; done
